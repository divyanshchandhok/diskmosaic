[package]
name = "wiztree"
version = "0.1.0"
edition = "2024"
description = "Cross-platform disk space analyzer modelled on WizTree"
license = "MIT"

[features]
default = ["mimalloc"]

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rayon = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rfd = "0.15"
notify = "8"
trash = "5"
open = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
png = "0.18"
mimalloc = { version = "0.1", default-features = false, optional = true }
memchr = "2"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
